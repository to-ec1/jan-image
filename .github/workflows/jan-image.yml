name: JAN Product Image Search

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install ddg-rs
          pip install google-api-python-client
          pip install google-auth
          pip install google-auth-oauthlib
          pip install pillow

      - name: Create program
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          cat > main.py <<'PY'
          import os
          import io
          import time
          import random
          import urllib.request
          import urllib.parse
          from PIL import Image

          from ddg import Browser

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseUpload

          SPREADSHEET_ID = os.environ["SPREADSHEET_ID"]
          DRIVE_FOLDER_ID = os.environ["DRIVE_FOLDER_ID"]

          CLIENT_ID = os.environ["GOOGLE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["GOOGLE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["GOOGLE_REFRESH_TOKEN"]

          SCOPES = [
              "https://www.googleapis.com/auth/spreadsheets",
              "https://www.googleapis.com/auth/drive"
          ]

          # -----------------------------
          # Google OAuth
          # -----------------------------

          creds = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=SCOPES
          )

          creds.refresh(Request())

          sheets = build(
              "sheets",
              "v4",
              credentials=creds
          )

          drive = build(
              "drive",
              "v3",
              credentials=creds
          )

          # -----------------------------
          # Spreadsheet取得
          # -----------------------------

          result = sheets.spreadsheets().values().get(
              spreadsheetId=SPREADSHEET_ID,
              range="image!A:F"
          ).execute()

          rows = result.get("values", [])

          print(f"取得行数: {len(rows)}")

          # -----------------------------
          # JAN候補を抽出
          # -----------------------------

          targets = []

          for row_index, row in enumerate(rows[1:], start=2):

              def cell(col):
                  index = ord(col) - ord("A")
                  return row[index].strip() if len(row) > index else ""

              product = cell("A")
              jan1 = cell("B")
              jan2 = cell("C")
              image1 = cell("D")
              image2 = cell("E")
              image3 = cell("F")

              # 画像IDが1つでも入っていたら処理済み
              if image1 or image2 or image3:
                  continue

              # JAN1優先
              if jan1:
                  jan = jan1
              elif jan2:
                  jan = jan2
              else:
                  continue

              targets.append(
                  (row_index, jan, product)
              )

          print(f"処理対象: {len(targets)}件")

          # -----------------------------
          # 優先順位
          # -----------------------------

          PRIORITY = {
              "rakuten.co.jp": 1,
              "r10s.jp": 1,

              "yahoo.co.jp": 2,
              "yimg.jp": 2,

              "amazon.co.jp": 3,
              "amazon.jp": 3,

              "yodobashi.com": 4,
          }

          KNOWN_OTHER = {
              "cainz.com",
              "lohaco.yahoo.co.jp",
              "askul.co.jp",
              "biccamera.com",
              "yamada-denkiweb.com",
              "nojima.co.jp",
              "joshinweb.jp",
          }

          def get_domain(url):
              try:
                  return urllib.parse.urlparse(url).netloc.lower()
              except Exception:
                  return ""

          def get_priority(img):

              image_url = getattr(img, "image", "")
              page_url = getattr(img, "url", "")

              domains = [
                  get_domain(image_url),
                  get_domain(page_url)
              ]

              # 楽天・Yahoo・Amazon・ヨドバシ
              for domain in domains:

                  for key, priority in PRIORITY.items():
                      if key in domain:
                          return priority

              # その他の大手販売サイト
              for domain in domains:

                  for key in KNOWN_OTHER:
                      if key in domain:
                          return 6

              # 上記以外
              # メーカーサイト候補として5位
              return 5

          # -----------------------------
          # 画像ダウンロード
          # -----------------------------

          def download_image(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "Chrome/131 Safari/537.36"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  data = response.read()

              if len(data) < 5000:
                  raise ValueError("画像サイズが小さすぎます")

              # Pillowで画像として検証
              image = Image.open(
                  io.BytesIO(data)
              )

              image.load()

              # RGB JPEGへ統一
              if image.mode not in ("RGB", "L"):
                  image = image.convert("RGB")

              output = io.BytesIO()

              image.save(
                  output,
                  format="JPEG",
                  quality=95
              )

              return output.getvalue()

          # -----------------------------
          # Driveアップロード
          # -----------------------------

          def upload_drive(data, filename):

              metadata = {
                  "name": filename,
                  "parents": [DRIVE_FOLDER_ID]
              }

              media = MediaIoBaseUpload(
                  io.BytesIO(data),
                  mimetype="image/jpeg",
                  resumable=False
              )

              file = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id"
              ).execute()

              return file["id"]

          # -----------------------------
          # Sheets更新
          # -----------------------------

          def update_sheet(row_number, ids):

              values = [ids]

              sheets.spreadsheets().values().update(
                  spreadsheetId=SPREADSHEET_ID,
                  range=f"image!D{row_number}:F{row_number}",
                  valueInputOption="RAW",
                  body={
                      "values": values
                  }
              ).execute()

          # -----------------------------
          # メイン処理
          # -----------------------------

          browser = Browser()

          processed = 0
          skipped = 0

          for row_number, jan, product in targets:

              print("")
              print("=" * 60)
              print(f"行: {row_number}")
              print(f"商品: {product}")
              print(f"JAN: {jan}")
              print("=" * 60)

              try:

                  # -------------------------
                  # JAN画像検索
                  # -------------------------

                  images = browser.images(
                      query=jan,
                      region="jp-jp",
                      safesearch=True,
                      limit=50
                  )

                  if not images:

                      print("画像検索結果なし")
                      skipped += 1
                      continue

                  # -------------------------
                  # 優先順位で並べ替え
                  # -------------------------

                  candidates = sorted(
                      images,
                      key=lambda img: (
                          get_priority(img),
                          -(
                              (getattr(img, "width", 0) or 0)
                              *
                              (getattr(img, "height", 0) or 0)
                          )
                      )
                  )

                  selected_ids = []
                  used_urls = set()

                  # -------------------------
                  # 最大3枚
                  # -------------------------

                  for img in candidates:

                      if len(selected_ids) >= 3:
                          break

                      image_url = getattr(
                          img,
                          "image",
                          ""
                      )

                      if not image_url:
                          continue

                      if image_url in used_urls:
                          continue

                      used_urls.add(image_url)

                      priority = get_priority(img)

                      print("")
                      print(
                          f"候補: 優先順位={priority}"
                      )
                      print(
                          f"タイトル: {img.title}"
                      )
                      print(
                          f"画像URL: {image_url}"
                      )
                      print(
                          f"元ページ: {img.url}"
                      )
                      print(
                          f"サイズ: "
                          f"{img.width}x{img.height}"
                      )

                      try:

                          data = download_image(
                              image_url
                          )

                          number = len(
                              selected_ids
                          ) + 1

                          filename = (
                              f"{jan}_{number:02d}.jpg"
                          )

                          file_id = upload_drive(
                              data,
                              filename
                          )

                          selected_ids.append(
                              file_id
                          )

                          print(
                              f"Drive保存成功: "
                              f"{filename}"
                          )
                          print(
                              f"画像ID: {file_id}"
                          )

                      except Exception as e:

                          print(
                              f"画像DL失敗: {e}"
                          )

                          continue

                  # -------------------------
                  # 0枚ならスキップ
                  # -------------------------

                  if not selected_ids:

                      print(
                          "画像取得0枚 → スキップ"
                      )

                      skipped += 1
                      continue

                  # -------------------------
                  # D/E/Fへ書き込み
                  # -------------------------

                  while len(selected_ids) < 3:
                      selected_ids.append("")

                  update_sheet(
                      row_number,
                      selected_ids[:3]
                  )

                  print("")
                  print(
                      f"Sheets更新成功: "
                      f"D{row_number}:F{row_number}"
                  )

                  processed += 1

                  # -------------------------
                  # 次のJANまでランダム待機
                  # -------------------------

                  wait_seconds = random.randint(
                      8,
                      20
                  )

                  print(
                      f"次の検索まで "
                      f"{wait_seconds}秒待機"
                  )

                  time.sleep(
                      wait_seconds
                  )

              except Exception as e:

                  print(
                      f"JAN {jan} の処理エラー: {e}"
                  )

                  # エラーが出ても次のJANへ
                  time.sleep(
                      random.randint(15, 30)
                  )

          print("")
          print("=" * 60)
          print("処理終了")
          print(f"成功: {processed}")
          print(f"スキップ: {skipped}")
          print("=" * 60)

          PY

      - name: Run
        run: python main.py
