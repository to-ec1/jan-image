name: JAN Product Image Search

on:
  workflow_dispatch:
    inputs:
      jan:
        description: "JANコード"
        required: true
        default: "4571414692199"

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDuckGo OSS
        run: |
          pip install ddg-rs

      - name: Search JAN and download product image
        env:
          JAN: ${{ inputs.jan }}
        run: |
          cat > jan_image_search.py <<'PY'
          from ddg import Browser
          import urllib.request
          import urllib.parse
          import os
          import re

          jan = os.environ["JAN"]

          browser = Browser()

          print(f"JAN: {jan}")
          print("商品画像を検索しています...")

          images = browser.images(
              query=jan,
              region="jp-jp",
              safesearch=True,
              limit=50
          )

          if not images:
              raise RuntimeError("画像検索結果がありません")

          # 優先順位
          priorities = {
              "rakuten.co.jp": 1,
              "r10s.jp": 1,
              "yahoo.co.jp": 2,
              "yimg.jp": 2,
              "amazon.co.jp": 3,
              "amazon.jp": 3,
              "yodobashi.com": 4,
          }

          def get_priority(img):
              urls = [
                  getattr(img, "image", ""),
                  getattr(img, "url", "")
              ]

              for url in urls:
                  try:
                      host = urllib.parse.urlparse(url).netloc.lower()

                      for domain, priority in priorities.items():
                          if domain in host:
                              return priority

                  except Exception:
                      pass

              # メーカーサイト・その他
              return 5

          # 優先順位 → 画像サイズの大きい順
          candidates = sorted(
              images,
              key=lambda img: (
                  get_priority(img),
                  -(getattr(img, "width", 0) or 0) *
                  -(getattr(img, "height", 0) or 0)
              )
          )

          os.makedirs("output", exist_ok=True)

          selected = None

          for i, img in enumerate(candidates, 1):

              image_url = getattr(img, "image", "")
              page_url = getattr(img, "url", "")
              title = getattr(img, "title", "")

              if not image_url:
                  continue

              priority = get_priority(img)

              print("")
              print(f"候補 {i}")
              print(f"優先順位: {priority}")
              print(f"タイトル: {title}")
              print(f"画像URL: {image_url}")
              print(f"元ページ: {page_url}")

              try:
                  request = urllib.request.Request(
                      image_url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 Chrome/131 Safari/537.36"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      data = response.read()

                      content_type = response.headers.get(
                          "Content-Type",
                          ""
                      ).lower()

                  if not data:
                      continue

                  # 画像以外を除外
                  if not content_type.startswith("image/"):
                      print("画像ではないためスキップ")
                      continue

                  # 極端に小さいファイルを除外
                  if len(data) < 5000:
                      print("ファイルサイズが小さいためスキップ")
                      continue

                  # 拡張子
                  if "png" in content_type:
                      ext = "png"
                  elif "webp" in content_type:
                      ext = "webp"
                  elif "gif" in content_type:
                      ext = "gif"
                  else:
                      ext = "jpg"

                  filename = f"product.{ext}"

                  with open(
                      f"output/{filename}",
                      "wb"
                  ) as f:
                      f.write(data)

                  selected = {
                      "jan": jan,
                      "priority": priority,
                      "title": title,
                      "image_url": image_url,
                      "page_url": page_url,
                      "content_type": content_type,
                      "size": len(data),
                      "filename": filename
                  }

                  print("")
                  print("================================")
                  print("画像取得成功")
                  print("================================")
                  print(selected)

                  break

              except Exception as e:
                  print(f"ダウンロード失敗: {e}")
                  continue

          if selected is None:
              raise RuntimeError(
                  "画像を1枚もダウンロードできませんでした"
              )

          with open(
              "output/result.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for key, value in selected.items():
                  f.write(f"{key}: {value}\n")

          PY

          python jan_image_search.py

      - name: Show downloaded image
        run: |
          echo "===== RESULT ====="
          cat output/result.txt
          echo ""
          echo "===== FILE ====="
          ls -lh output/

      - name: Upload product image
        uses: actions/upload-artifact@v4
        with:
          name: jan-product-image-${{ inputs.jan }}
          path: output/
